<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game — GameBurst</title><meta name="robots" content="index,follow"><link rel="stylesheet" href="/style.css"><style>
.game-page{max-width:1560px;margin:auto;padding:22px}.game-breadcrumb{font-size:11px;color:#7d8492;margin:0 0 14px}.game-breadcrumb a{color:#9e92ff}.game-layout{display:grid;grid-template-columns:210px minmax(0,1fr) 210px;gap:14px}.game-side{min-width:0}.side-heading{font-size:12px;font-weight:800;margin:2px 0 10px}.side-games{display:grid;gap:8px}.mini-game{display:grid;grid-template-columns:72px 1fr;gap:7px;align-items:center;padding:5px;border:1px solid var(--border);border-radius:8px;background:#12141a}.mini-game img{width:72px;height:54px;object-fit:cover;border-radius:6px}.mini-game span{font-size:10px;font-weight:700;line-height:1.25}.player-shell{background:#0d0f13;border:1px solid var(--border);border-radius:12px;overflow:hidden}.player{position:relative;background:#08090c;aspect-ratio:16/9;min-height:420px}.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.game-toolbar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--border);background:#12141a}.game-name{font-size:16px;font-weight:800;margin-right:auto}.game-rating{font-size:11px;color:#c5c9d2}.tool-btn,.copy-btn{border:1px solid var(--border);background:#171a21;color:#fff;border-radius:7px;padding:7px 10px;font-size:11px}.embed-row{display:flex;gap:7px;padding:9px;border-top:1px solid var(--border)}.embed-row input{flex:1;min-width:0;background:#0d0f13;border:1px solid var(--border);color:#aaa;border-radius:7px;padding:8px;font-size:10px}.copy-btn{background:#d9a900;color:#111;border:0;font-weight:800}.recommend-row{display:flex;gap:8px;overflow:auto;padding:10px 0}.recommend-row .thumb{min-width:94px;width:94px;aspect-ratio:4/3}.game-content{margin-top:14px;border:1px solid var(--border);border-radius:10px;padding:18px;background:#101217}.game-content h1{font-size:22px;margin:0 0 15px}.game-content h2{font-size:16px;margin:22px 0 8px}.game-content p,.game-content li{font-size:12px;line-height:1.7;color:#aeb4c0}.game-content ul{padding-left:18px}.game-tag{display:inline-block;border:1px solid #5b4900;color:#e3b900;border-radius:20px;padding:5px 9px;font-size:10px}.comment-box input,.comment-box textarea{display:block;width:100%;background:#0d0f13;border:1px solid var(--border);color:#fff;border-radius:7px;padding:10px;margin:8px 0;font-size:11px}.comment-box textarea{min-height:100px}.comment-box button{background:#e2b000;color:#111;border:0;border-radius:7px;padding:9px 14px;font-weight:800;font-size:11px}@media(max-width:1050px){.game-layout{grid-template-columns:1fr}.game-side{display:none}.player{min-height:0}}
</style></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="/"><span class="brand-mark"></span>GameBurst</a><nav class="main-nav"><a href="/">Home</a><a href="/#new-games">New</a><a href="/#popular-games">Popular</a><a href="/#categories">Categories</a></nav><div class="search-wrap"><span class="search-icon"></span><input id="siteSearch" placeholder="Search games..."><div id="searchResults" class="search-results"></div></div></div></header><main class="game-page" id="gamePage"><p>Loading game...</p></main><script>
const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};const slug=s=>String(s||'').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
async function load(){const wanted=location.pathname.replace(/^\/games\//,'').replace(/\/$/,'').toLowerCase();try{const games=await (await fetch('/data/games.json',{cache:'no-store'})).json();const all=games.map(g=>{const title=g.title??g.t??'Game';return {...g,title,category:g.category??g.c??'Games',image:g.image??g.img??g.banner_image??g.ban??'',banner:g.banner_image??g.ban??g.img??'',quality:Number(g.quality_score??g.q??0),embed:g.url??g.iframe??g.embed??'',slug:slug(title)}});const g=all.find(x=>x.slug===wanted);if(!g){document.getElementById('gamePage').innerHTML='<div class="game-content"><h1>Game not found</h1><p>The requested game could not be found in the catalog.</p><a class="primary-btn" href="/">Back to games</a></div>';return}document.title=g.title+' — Play Online Free | GameBurst';const related=all.filter(x=>x.category===g.category&&x.slug!==g.slug).sort((a,b)=>b.quality-a.quality).slice(0,10);const hot=[...all].sort((a,b)=>b.quality-a.quality).slice(0,10);const fresh=[...all].sort((a,b)=>new Date(b.date_published||b.date||0)-new Date(a.date_published||a.date||0)).slice(0,10);const mini=x=>`<a class="mini-game" href="/games/${encodeURIComponent(x.slug)}/"><img src="${esc(x.image||x.banner)}" alt=""><span>${esc(x.title)}</span></a>`;document.getElementById('gamePage').innerHTML=`<div class="game-breadcrumb"><a href="/">Home</a> › <a href="/#categories">${esc(g.category)}</a> › ${esc(g.title)}</div><div class="game-layout"><aside class="game-side"><div class="side-heading">Hot Games</div><div class="side-games">${hot.map(mini).join('')}</div></aside><section><div class="player-shell"><div class="player"><iframe src="${esc(g.embed)}" title="${esc(g.title)}" allow="gamepad *; fullscreen *; autoplay; encrypted-media" allowfullscreen></iframe></div><div class="game-toolbar"><div class="game-name">${esc(g.title)}</div><div class="game-rating">★ ${Math.round(g.quality*100)}</div><button class="tool-btn" onclick="document.querySelector('.player').requestFullscreen?.()">Fullscreen</button></div><div class="embed-row"><input id="embedUrl" value="${esc(g.embed)}" readonly><button class="copy-btn" onclick="navigator.clipboard?.writeText(document.getElementById('embedUrl').value);this.textContent='Copied'">Copy</button></div></div><div class="recommend-row">${related.map(x=>`<a class="game-card" style="min-width:94px" href="/games/${encodeURIComponent(x.slug)}/"><div class="thumb"><img src="${esc(x.image||x.banner)}" alt=""></div></a>`).join('')}</div><article class="game-content"><span class="game-tag">${esc(g.category)}</span><h1>About ${esc(g.title)}</h1><p>Play ${esc(g.title)} online for free in your browser. No download is required. Start the game above and enjoy quick, browser-based gameplay.</p><h2>How to Play</h2><p>Use the controls shown by the game and follow its on-screen instructions. Keep your focus on the objective and try to improve your score with each attempt.</p><h2>Game Features</h2><ul><li>Free browser gameplay</li><li>Instant access without a download</li><li>Works on desktop and supported mobile browsers</li><li>Easy to start and replay</li></ul><p class="game-tag">${esc(g.category)} games</p><div class="comment-box"><h2>Discuss ${esc(g.title)}</h2><input placeholder="Name"><input placeholder="Email" type="email"><textarea placeholder="Comment"></textarea><label style="font-size:10px;color:#858c99"><input type="checkbox"> I agree to the terms and conditions.</label><br><button>Post Comment</button></div></article></section><aside class="game-side"><div class="side-heading">New Games</div><div class="side-games">${fresh.map(mini).join('')}</div></aside></div>`}catch(e){console.error(e);document.getElementById('gamePage').innerHTML='<div class="game-content"><h1>Unable to load game</h1><p>Please refresh and try again.</p></div>'}}
load();
</script></body></html>
