<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameBurst — Play 13,000+ Free Games Online</title>
<meta name="description" content="Play free browser games instantly. Arcade, puzzle, racing, shooter and more — no downloads needed.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-area">
    <header class="topbar">
      <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
      <div class="topbar-search">
        <svg class="search-ic" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2.5"/><path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        <input id="globalSearch" type="text" placeholder="Search games and categories" autocomplete="off">
        <div class="search-suggest" id="searchSuggest"></div>
      </div>
      <div class="topbar-right" id="topbarRight">
        <span class="game-counter"><span class="dot"></span><span id="gameCounter">0</span> games</span>
      </div>
    </header>

    <!-- hero slideshow (auto-advancing) -->
    <div class="hero-slideshow-wrap">
      <div class="hero-slideshow" id="heroSlideshow">
        <div id="heroSlides"></div>
        <button class="hero-arrow prev" id="heroPrev" aria-label="Previous slide">
          <svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="hero-arrow next" id="heroNext" aria-label="Next slide">
          <svg viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="hero-slideshow-nav" id="heroDots"></div>
      </div>
    </div>

    <!-- Top Picks: bento grid (1 large + small cards) -->
    <section class="section">
      <div class="section-head">
        <h2 class="section-title">🎯 Top Picks for You</h2>
      </div>
      <div class="bento-grid" id="bentoGrid"></div>
    </section>

    <!-- Featured -->
    <section class="section">
      <div class="section-head">
        <h2 class="section-title">⭐ Featured Games</h2>
        <a class="section-link" href="all.html?sort=quality">See all →</a>
      </div>
      <div class="hscroll" id="featuredRow"></div>
    </section>

    <!-- New -->
    <section class="section">
      <div class="section-head">
        <h2 class="section-title">🆕 New Games</h2>
        <a class="section-link" href="all.html?sort=new">See all →</a>
      </div>
      <div class="hscroll" id="newRow"></div>
    </section>

    <!-- Category sections (dynamic, few top categories) -->
    <div id="categorySections"></div>

    <footer class="site-footer">
      <p>GameBurst — <span id="footerCount">13,485</span> free games. Play instantly in your browser, no downloads.</p>
    </footer>
  </div>
</div>

<script src="shared.js"></script>
<script>
(async function(){
  await GB.loadData();
  GB.buildSidebar('home');
  GB.initTopbarSearch();
  GB.initMobileSidebar();
  GB.buildTopbarRight();
  GB.setGameCounter();
  document.getElementById('footerCount').textContent = GB.games.length.toLocaleString();

  const games = GB.games;

  // Hero slideshow: high quality games, shuffled selection, auto-advancing
  const slidePicks = GB.shuffle(games.filter(g=>g.q>0.4)).slice(0,7);
  const slidesEl = document.getElementById('heroSlides');
  const dotsEl = document.getElementById('heroDots');
  let currentSlide = 0;
  let slideTimer = null;

  slidePicks.forEach((g, i)=>{
    const slide = document.createElement('a');
    slide.className = 'hero-slide' + (i===0 ? ' active' : '');
    slide.href = GB.gameUrlFor(g);
    slide.innerHTML = `
      <img src="${GB.escapeHtml(g.ban || g.img)}" alt="${GB.escapeHtml(g.t)}" loading="${i===0?'eager':'lazy'}">
      <div class="hero-slide-overlay">
        <div>
          <div class="hero-slide-title">${GB.escapeHtml(g.t)}</div>
          <span class="hero-slide-cat">${GB.emojiFor(g.c)} ${GB.escapeHtml(GB.capitalize(g.c))}</span>
        </div>
      </div>
    `;
    slidesEl.appendChild(slide);

    const dot = document.createElement('button');
    dot.className = 'hero-dot' + (i===0 ? ' active' : '');
    dot.setAttribute('aria-label', 'Slide ' + (i+1));
    dot.addEventListener('click', ()=> goToSlide(i));
    dotsEl.appendChild(dot);
  });

  function goToSlide(i){
    const slides = slidesEl.querySelectorAll('.hero-slide');
    const dots = dotsEl.querySelectorAll('.hero-dot');
    slides[currentSlide]?.classList.remove('active');
    dots[currentSlide]?.classList.remove('active');
    currentSlide = (i + slides.length) % slides.length;
    slides[currentSlide]?.classList.add('active');
    dots[currentSlide]?.classList.add('active');
    resetTimer();
  }
  function nextSlide(){ goToSlide(currentSlide + 1); }
  function prevSlide(){ goToSlide(currentSlide - 1); }
  function resetTimer(){
    clearInterval(slideTimer);
    slideTimer = setInterval(nextSlide, 4500);
  }
  if(slidePicks.length > 1){
    document.getElementById('heroNext').addEventListener('click', e=>{ e.preventDefault(); nextSlide(); });
    document.getElementById('heroPrev').addEventListener('click', e=>{ e.preventDefault(); prevSlide(); });
    resetTimer();
    // pause auto-advance while the user is interacting with the slideshow
    const shell = document.getElementById('heroSlideshow');
    shell.addEventListener('mouseenter', ()=> clearInterval(slideTimer));
    shell.addEventListener('mouseleave', resetTimer);
  } else {
    document.getElementById('heroNext').style.display = 'none';
    document.getElementById('heroPrev').style.display = 'none';
  }

  // Top Picks bento grid: 1 large hero card + 5 smaller cards, different picks than the slideshow
  const usedSlugs = new Set(slidePicks.map(g=>g.slug));
  const bentoPool = GB.shuffle(games.filter(g=> g.q>0.35 && !usedSlugs.has(g.slug)));
  const bentoPicks = bentoPool.slice(0, 6);
  const bentoGrid = document.getElementById('bentoGrid');
  bentoPicks.forEach((g, i)=>{
    const card = document.createElement('a');
    card.className = 'bento-card' + (i===0 ? ' bento-large' : '');
    card.href = GB.gameUrlFor(g);
    card.style.animationDelay = (i*0.03) + 's';
    card.innerHTML = `
      <img class="bento-card-img" src="${GB.escapeHtml(g.ban || g.img)}" alt="${GB.escapeHtml(g.t)}" loading="lazy" onerror="this.onerror=null;this.src='${GB.escapeHtml(g.img)}'">
      <div class="bento-card-overlay">
        <span class="bento-card-title">${GB.escapeHtml(g.t)}</span>
      </div>
    `;
    bentoGrid.appendChild(card);
  });

  // Featured: top quality
  const featured = games.slice().sort((a,b)=>b.q-a.q).slice(0,16);
  const featuredRow = document.getElementById('featuredRow');
  featured.forEach((g,i)=>{
    const badge = i<3 ? 'top' : undefined;
    featuredRow.appendChild(GB.buildCardEl(g, {delay:i*0.02, badge}));
  });

  // New: just a shuffled sample tagged "new" for demo variety
  const newGames = GB.shuffle(games).slice(0,16);
  const newRow = document.getElementById('newRow');
  newGames.forEach((g,i)=> newRow.appendChild(GB.buildCardEl(g, {delay:i*0.02, badge:'new'})));

  // Category sections: top 6 categories, 8 games each
  const catContainer = document.getElementById('categorySections');
  const topCats = GB.topCategories(6);
  topCats.forEach(([cat])=>{
    const catGames = games.filter(g=>g.c===cat).sort((a,b)=>b.q-a.q).slice(0,10);
    if(catGames.length===0) return;
    const section = document.createElement('section');
    section.className = 'section';
    section.innerHTML = `
      <div class="section-head">
        <h2 class="section-title">${GB.emojiFor(cat)} ${GB.capitalize(cat)}</h2>
        <a class="section-link" href="${GB.categoryUrlFor(cat)}">See all →</a>
      </div>
      <div class="hscroll"></div>
    `;
    const row = section.querySelector('.hscroll');
    catGames.forEach((g,i)=> row.appendChild(GB.buildCardEl(g, {delay:i*0.02})));
    catContainer.appendChild(section);
  });
})();
</script>
</body>
</html>
