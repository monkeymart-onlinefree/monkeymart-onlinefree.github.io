<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Arcade</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { font-family: Arial, sans-serif; background-color: #0b0f19; color: #fff; margin: 0; padding: 20px; }
    header { text-align: center; margin-bottom: 25px; }
    header h1 { color: #38bdf8; margin-bottom: 12px; }
    #search-input { width: 90%; max-width: 400px; padding: 10px 15px; border-radius: 20px; border: 1px solid #38bdf8; background: #1e293b; color: #fff; font-size: 15px; }
    .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; max-width: 1100px; margin: 0 auto; }
    .game-card { background: #1e293b; border-radius: 8px; padding: 10px; text-decoration: none; color: #fff; text-align: center; border: 1px solid #334155; }
    .game-card img { width: 100%; height: 110px; object-fit: cover; border-radius: 6px; }
    .card-title { margin-top: 8px; font-size: 13px; font-weight: bold; text-transform: capitalize; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #status-msg { text-align: center; font-size: 18px; margin-top: 40px; color: #38bdf8; }
  </style>
</head>
<body>

  <header>
    <h1>🎮 GAME ARCADE</h1>
    <input type="text" id="search-input" placeholder="Search 13,000+ games..." onkeyup="filterGames()">
  </header>

  <main>
    <div id="status-msg">Loading catalog...</div>
    <div id="games-grid" class="games-grid"></div>
  </main>

  <script src="shared.js"></script>
</body>
</html>
