<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Category — GameBurst</title>
<meta name="description" content="Browse free games by category on GameBurst.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-area">
    <header class="topbar">
      <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
      <div class="topbar-search">
        <svg class="search-ic" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2.5"/><path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        <input id="globalSearch" type="text" placeholder="Search games and categories" autocomplete="off">
        <div class="search-suggest" id="searchSuggest"></div>
      </div>
      <div class="topbar-right" id="topbarRight">
        <span class="game-counter"><span class="dot"></span><span id="gameCounter">0</span> games</span>
      </div>
    </header>

    <div class="page-header cat-page-header">
      <div class="cat-header-icon" id="catIcon">🎮</div>
      <div>
        <h1 class="page-title" id="catTitle">Category</h1>
        <p class="page-sub" id="catSub"></p>
      </div>
    </div>

    <p class="cat-blurb" id="catBlurb"></p>

    <div class="toolbar">
      <div></div>
      <div class="toolbar-sort">
        <label for="sortSelect">Sort by</label>
        <select id="sortSelect">
          <option value="quality">Top Rated</option>
          <option value="az">A–Z</option>
          <option value="za">Z–A</option>
        </select>
      </div>
    </div>

    <div class="grid-page" id="grid"></div>
    <div id="emptyState" class="empty-state" hidden>
      <div class="empty-emoji">🕹️💨</div>
      <p>No games in this category.</p>
      <a class="btn-reset" href="index.html" style="display:inline-block;text-decoration:none;">Back to Home</a>
    </div>
    <div class="load-more-wrap">
      <button class="load-more-btn" id="loadMoreBtn">Load More Games ↓</button>
    </div>

    <footer class="site-footer">
      <p>GameBurst — <span id="footerCount">13,485</span> free games. Play instantly in your browser, no downloads.</p>
    </footer>
  </div>
</div>

<script src="shared.js"></script>
<script>
(async function(){
  await GB.loadData();
  GB.initTopbarSearch();
  GB.initMobileSidebar();
  GB.buildTopbarRight();
  GB.setGameCounter();
  document.getElementById('footerCount').textContent = GB.games.length.toLocaleString();

  const cat = GB.qs('c') || '';
  GB.buildSidebar(cat);

  let list = GB.games.filter(g=>g.c === cat);
  document.getElementById('pageTitle').textContent = GB.capitalize(cat) + ' Games — GameBurst';
  document.getElementById('catIcon').textContent = GB.emojiFor(cat);
  document.getElementById('catTitle').textContent = GB.capitalize(cat) + ' Games';
  document.getElementById('catSub').textContent = list.length.toLocaleString() + ' free games in this category';
  document.getElementById('catBlurb').textContent =
    `Play our free online ${GB.capitalize(cat).toLowerCase()} games. Have fun playing hundreds of the best ${GB.capitalize(cat).toLowerCase()} games for free, right in your browser — no downloads needed.`;

  const grid = document.getElementById('grid');
  const emptyState = document.getElementById('emptyState');
  const loadMoreBtn = document.getElementById('loadMoreBtn');
  const sortSelect = document.getElementById('sortSelect');

  let visible = 30;
  const PAGE = 30;

  function sortList(){
    const s = sortSelect.value;
    const sorted = list.slice();
    if(s==='quality') sorted.sort((a,b)=>b.q-a.q);
    else if(s==='az') sorted.sort((a,b)=>a.t.localeCompare(b.t));
    else if(s==='za') sorted.sort((a,b)=>b.t.localeCompare(a.t));
    return sorted;
  }

  function render(){
    const sorted = sortList();
    if(sorted.length===0){
      grid.innerHTML=''; emptyState.hidden=false; loadMoreBtn.hidden=true; return;
    }
    emptyState.hidden = true;
    grid.innerHTML = '';
    const slice = sorted.slice(0, visible);
    slice.forEach((g,i)=> grid.appendChild(GB.buildCardEl(g, {delay: Math.min(i,24)*0.02})));
    loadMoreBtn.hidden = visible >= sorted.length;
  }

  sortSelect.addEventListener('change', ()=>{ visible = PAGE; render(); });
  loadMoreBtn.addEventListener('click', ()=>{ visible += PAGE; render(); });

  render();
})();
</script>
</body>
</html>
