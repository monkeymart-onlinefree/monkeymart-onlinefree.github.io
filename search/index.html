<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index, follow">
  <title>Search Games - Monkey Mart</title>
  <meta name="description" content="Search free online games and play instantly in your browser.">
  <link rel="stylesheet" type="text/css" href="/assest/css/games.css">
  <link rel="stylesheet" type="text/css" href="/assest/css/game-page.css">
  <link rel="stylesheet" type="text/css" href="/assest/css/nav.css">
  <link rel="stylesheet" type="text/css" href="/assest/css/all.css">
</head>
<body>
  <div id="ubgHeader" class="app-header desktop-nav-layout">
    <div class="header-left">
      <a href="/">
        <div class="site-logo">
          <div class="logo-icon">
            <img src="/favicon.png" alt="Monkey Mart Unblocked" class="logo-image"
              style="width: 40px; height: 40px; margin-right: 10px;">
            <strong style="color: rgb(255, 255, 255); font-size: 24px; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif">Monkey Mart</strong>
          </div>
        </div>
      </a>
    </div>
    <form class="search-form desktop-layout" action="/search/" method="get" autocomplete="off">
      <div class="search-input-wrapper">
        <input class="search-input search-field desktop-layout" id="search-input" name="q"
          placeholder="Search games and categories" type="text" autocomplete="off" autocorrect="off"
          autocapitalize="off" spellcheck="false" aria-label="Search games and categories">
        <div class="icon-box"><span role="img" aria-hidden="true" class="icon icon-search icon-size-20"></span></div>
        <div id="search-suggestions" class="search-results-dropdown hidden"></div>
      </div>
    </form>
    <div class="header-right">
      <a href="/all-games/" aria-label="All Games" class="btn btn-link-white btn-header-icon btn-header-icon-desktop">
        <img src="/assest/icon/joystick-game-control-svgrepo-com.svg" alt="All Games"><span>All Games</span>
      </a>
      <a href="/popular/" aria-label="Popular Games" class="btn btn-link-white btn-header-icon btn-header-icon-desktop">
        <img src="/assest/icon/category-svgrepo-com.svg" alt="Popular Games"><span>Popular Games</span>
      </a>
      <a href="/setting/" aria-label="Setting" class="btn btn-link-white btn-header-icon btn-header-icon-desktop setting-icon">
        <img src="/assest/icon/settings-cog-line-svgrepo-com.svg" alt="Setting">
      </a>
    </div>
  </div>

  <div id="skrHeader" class="Header_mobile-43dhd mobile-nav-layout">
    <div class="Header_left-43dhd">
      <a href="/">
        <div class="logo-43dhd">
          <div class="logo_icon-48dhd"><img src="/favicon.png" alt="Monkey Mart" class="logo_image-48dhd"></div>
        </div>
      </a>
    </div>
    <div class="header-right">
      <button id="mobile-search-button" type="button" aria-label="Open search"
        class="btn btn-link-white btn-header-icon btn-header-icon-desktop mobile-search-button">
        <span class="icon icon-search icon-size-20"></span>
      </button>
      <a href="/all-games/" aria-label="All Games"
        class="btn btn-link-white btn-header-icon btn-header-icon-desktop btskr-icon">
        <img src="/assest/icon/joystick-game-control-svgrepo-com.svg" alt="All Games">
      </a>
      <a href="/popular/" aria-label="Popular Games"
        class="btn btn-link-white btn-header-icon btn-header-icon-desktop btskr-icon">
        <img src="/assest/icon/category-svgrepo-com.svg" alt="Popular Games">
      </a>
      <a href="/setting/" aria-label="Setting"
        class="btn btn-link-white btn-header-icon btn-header-icon-desktop setting-icon">
        <img src="/assest/icon/settings-cog-line-svgrepo-com.svg" alt="Setting">
      </a>
    </div>
  </div>

  <div id="mobile-search-popup" class="mobile-search-popup" aria-hidden="true">
    <div class="mobile-search-popup-panel">
      <div class="mobile-search-popup-header">
        <h2>Search Games</h2>
        <button id="mobile-search-close" type="button" aria-label="Close search" class="mobile-search-close">×</button>
      </div>
      <form id="mobile-search-form" class="mobile-search-form" action="/search/" method="get" autocomplete="off">
        <input id="mobile-search-input" class="search-input mobile-search-field" name="q"
          placeholder="Search games and categories" type="text" autocomplete="off" autocorrect="off"
          autocapitalize="off" spellcheck="false" aria-label="Search games and categories">
        <button type="submit" class="btn btn-link-white mobile-search-submit">Search</button>
      </form>
      <p class="mobile-search-note">Enter a game name to see matching results.</p>
    </div>
  </div>

  <main id="root">
    <section id="search-results-page" class="search-results-page active" aria-live="polite">
      <div class="search-results-header">
        <div>
          <h1 id="search-results-title" class="search-results-title"></h1>
          <p id="search-results-note" class="search-results-note"></p>
        </div>
        <button id="search-results-close" class="search-results-close" type="button">Close</button>
      </div>
      <div id="search-results-grid" class="search-results-grid"></div>
    </section>
  </main>

  <script src="/assest/js/search.js"></script>
</body>
</html>
