<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{GAME_NAME}} — Play Free Online | GameBurst</title>
<meta name="description" content="{{META_DESCRIPTION}}">
<link rel="stylesheet" href="/style.css">
<style>
.game-page{max-width:1560px;margin:auto;padding:22px}
.game-breadcrumb{font-size:11px;color:#7d8492;margin:0 0 14px}.game-breadcrumb a{color:#a79cff}.game-layout{display:grid;grid-template-columns:210px minmax(0,1fr) 210px;gap:14px;align-items:start}
.game-side{min-width:0}.side-heading{font-size:12px;font-weight:800;margin:2px 0 10px}.side-games{display:grid;gap:8px}.mini-game{display:grid;grid-template-columns:72px 1fr;gap:7px;align-items:center;padding:5px;border:1px solid var(--border);border-radius:8px;background:#12141a}.mini-game img{width:72px;height:54px;object-fit:cover;border-radius:6px}.mini-game span{font-size:10px;font-weight:700;line-height:1.25}.game-main{min-width:0}.player-shell{background:#0d0f13;border:1px solid var(--border);border-radius:12px;overflow:hidden}.player{position:relative;background:#08090c;aspect-ratio:16/9;min-height:420px}.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.player-placeholder{position:absolute;inset:0;display:grid;place-items:center;background:#111318;color:#fff;font-weight:700}.game-toolbar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--border);background:#12141a}.game-name{font-size:16px;font-weight:800;margin-right:auto}.game-rating{font-size:11px;color:#c5c9d2}.tool-btn{border:1px solid var(--border);background:#171a21;color:#dfe2e8;border-radius:7px;padding:7px 10px;font-size:11px}.embed-row{display:flex;gap:7px;padding:9px;border-top:1px solid var(--border)}.embed-row input{flex:1;min-width:0;background:#0d0f13;border:1px solid var(--border);color:#aaa;border-radius:7px;padding:8px;font-size:10px}.copy-btn{background:#d9a900;color:#111;border:0;border-radius:7px;padding:8px 11px;font-size:10px;font-weight:800}.recommend-row{display:flex;gap:8px;overflow:auto;padding:10px 0}.recommend-row .thumb{min-width:94px;width:94px;aspect-ratio:4/3}.game-content{margin-top:14px;border:1px solid var(--border);border-radius:10px;padding:18px;background:#101217}.game-content h1{font-size:22px;margin:0 0 15px}.game-content h2{font-size:16px;margin:22px 0 8px}.game-content p,.game-content li{font-size:12px;line-height:1.7;color:#aeb4c0}.game-content ul{padding-left:18px}.game-tag{display:inline-block;border:1px solid #5b4900;color:#e3b900;border-radius:20px;padding:5px 9px;font-size:10px;margin-top:8px}.comment-box{margin-top:20px}.comment-box input,.comment-box textarea{display:block;width:100%;background:#0d0f13;border:1px solid var(--border);color:#fff;border-radius:7px;padding:10px;margin:8px 0;font-size:11px}.comment-box textarea{min-height:100px;resize:vertical}.comment-box button{background:#e2b000;color:#111;border:0;border-radius:7px;padding:9px 14px;font-weight:800;font-size:11px}
@media(max-width:1050px){.game-layout{grid-template-columns:1fr}.game-side{display:none}.player{min-height:0}}
</style>
</head>
<body>
<header class="site-header"><div class="header-inner">
<a class="brand" href="/"><span class="brand-mark"></span>GameBurst</a>
<nav class="main-nav"><a href="/">Home</a><a href="/#new-games">New</a><a href="/#popular-games">Popular</a><a href="/#categories">Categories</a></nav>
<div class="search-wrap"><span class="search-icon"></span><input id="gameSearch" placeholder="Search games..." autocomplete="off"><button class="clear-search" id="clearGameSearch">×</button><div class="search-results" id="gameSearchResults"></div></div>
</div></header>

<main class="game-page">
<div class="game-breadcrumb"><a href="/">Home</a> &nbsp;›&nbsp; <a href="/#categories">{{CATEGORY}}</a> &nbsp;›&nbsp; {{GAME_NAME}}</div>
<div class="game-layout">
<aside class="game-side"><div class="side-heading">Hot Games</div><div class="side-games" id="hotGames"></div></aside>

<section class="game-main">
<div class="player-shell">
<div class="player">
<iframe src="{{GAMEPIX_IFRAME}}" title="{{GAME_NAME}}" allow="fullscreen; autoplay" allowfullscreen loading="eager"></iframe>
</div>
<div class="game-toolbar"><div class="game-name">{{GAME_NAME}}</div><div class="game-rating">★ {{RATING}}</div><button class="tool-btn" onclick="toggleFullscreen()">Fullscreen</button></div>
<div class="embed-row"><input id="embedUrl" value="{{GAMEPIX_IFRAME}}" readonly><button class="copy-btn" onclick="copyEmbed()">Copy</button></div>
</div>
<div class="recommend-row" id="recommendGames"></div>

<article class="game-content">
<div class="game-tag">{{CATEGORY}}</div>
<h1>About {{GAME_NAME}}</h1>
{{CONTENT}}

<div class="comment-box">
<h2>Discuss {{GAME_NAME}}</h2>
<input placeholder="Name">
<input type="email" placeholder="Email">
<textarea placeholder="Comment"></textarea>
<label style="font-size:10px;color:#858c99"><input type="checkbox"> I have read and agree to the terms and conditions.</label>
<br><button>Post Comment</button>
</div>
</article>
</section>

<aside class="game-side"><div class="side-heading">New Games</div><div class="side-games" id="newGames"></div></aside>
</div>
</main>

<script>
function toggleFullscreen(){const f=document.querySelector('.player');if(document.fullscreenElement)document.exitFullscreen();else f.requestFullscreen?.()}
function copyEmbed(){const i=document.getElementById('embedUrl');navigator.clipboard?.writeText(i.value);event.target.textContent='Copied';setTimeout(()=>event.target.textContent='Copy',1000)}
(async()=>{try{const games=await (await fetch('/data/games.json',{cache:'no-store'})).json();const mini=(g)=>`<a class="mini-game" href="/games/${encodeURIComponent(g.namespace||g.title.toLowerCase().replace(/[^a-z0-9]+/g,'-'))}/"><img src="${g.banner_image||g.image}" alt=""><span>${g.title}</span></a>`;const sorted=[...games].sort((a,b)=>Number(b.quality_score||0)-Number(a.quality_score||0));document.getElementById('hotGames').innerHTML=sorted.slice(0,10).map(mini).join('');document.getElementById('newGames').innerHTML=[...games].sort((a,b)=>new Date(b.date_published||0)-new Date(a.date_published||0)).slice(0,10).map(mini).join('');document.getElementById('recommendGames').innerHTML=sorted.slice(10,18).map(g=>`<a class="game-card" style="min-width:94px" href="/games/${encodeURIComponent(g.namespace||'')}/"><div class="thumb"><img src="${g.banner_image||g.image}" alt=""></div></a>`).join('')}catch(e){console.error(e)}})();
</script>
</body>
</html>
